<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<title>Orderly</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --brand:#FFC83D;--brand-dark:#F2B705;--brand-weak:#FFF3CF;--brand-text:#8A5A00;
  --ink:#2B241C;--sub:#5F564A;--ter:#776D60;--line:#ECE3D2;--bg:#F7F1E5;--surface:#FFFDF8;--beige:#F3E9D6;
  --danger:#C62F28;--ok:#2F7A3B;--hot:#A63A0A;--hot-weak:#FDEBDD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html.large{font-size:19px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--brand-text);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;position:relative}
@media(min-width:560px){.app{box-shadow:0 0 0 1px var(--line)}}
#view{flex:1;display:flex;flex-direction:column}
h1:focus,h2:focus{outline:none}

/* 공통 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:100%;border-radius:14px;font-size:1.0625rem;font-weight:700;padding:0 20px}
.btn-primary{background:var(--brand);color:var(--ink)}
.btn-primary:active{background:var(--brand-dark)}
.btn-primary:disabled{background:#E9E1D1;color:#8C8273}
.btn-secondary{background:var(--bg);color:var(--ink)}
.btn-sm{min-height:44px;width:auto;font-size:.9375rem;border-radius:12px;padding:0 16px}
.icon-btn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--sub);flex:none}
.icon-btn:active{background:var(--bg)}
.ic{display:inline-flex;line-height:0}
.ic svg{width:24px;height:24px}

/* 손님 홈 */
.store-head{padding:20px 12px 8px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.store-head h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.table-no{margin:2px 0 0;color:var(--sub);font-size:.9375rem}
.order-banner{margin:0 20px 16px;display:flex;align-items:center;gap:12px;width:calc(100% - 40px);min-height:56px;padding:12px 16px;border-radius:14px;background:var(--brand-weak);color:var(--brand-text);font-weight:600;text-align:left}
.order-banner span{flex:1}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);display:flex;gap:4px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:52px;padding:0 12px;font-size:1rem;font-weight:600;color:var(--ter);border-bottom:2px solid transparent}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.menu-section{scroll-margin-top:52px}
.menu-section h2{margin:0;padding:24px 20px 4px;font-size:1.125rem;font-weight:700}
.menu-list{list-style:none;margin:0;padding:0}
.menu-row{width:100%;display:flex;gap:16px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line);text-align:left}
.menu-list li:last-child .menu-row{border-bottom:0}
.menu-row:active{background:var(--bg)}
.menu-row .info{flex:1;min-width:0}
.menu-row .name{margin:0;font-size:1.0625rem;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.menu-row .desc{margin:4px 0 0;color:var(--sub);font-size:.875rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu-row .price{margin:8px 0 0;font-weight:700}
.menu-row.soldout .name,.menu-row.soldout .price{color:var(--ter)}
.menu-row.soldout .thumb{opacity:.5}
.thumb{width:88px;height:88px;flex:none;border-radius:12px;background:var(--beige);display:grid;place-items:center;color:#A8936F}
.thumb .ic svg{width:34px;height:34px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:.75rem;font-weight:600}
.badge.hot{background:var(--hot-weak);color:var(--hot)}
.badge.best{background:var(--brand-weak);color:var(--brand-text)}
.badge.out{background:var(--bg);color:var(--sub)}
.foot{margin-top:24px;padding:24px 20px 230px;background:var(--bg);color:var(--sub);font-size:.875rem}
.foot p{margin:0 0 12px}
.foot .row{display:flex;gap:8px;margin-bottom:20px}
.foot .brand{color:var(--ter);font-size:.8125rem;display:flex;justify-content:space-between;align-items:center}
.foot .brand b{font-weight:800;letter-spacing:-.02em;color:var(--sub)}
.foot .brand a{color:var(--ter);text-decoration:underline;padding:8px 0}
.bottom-bar{position:sticky;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--surface) 75%,rgba(255,253,248,0))}
.cart-btn{justify-content:space-between}
.cart-btn .l{display:flex;align-items:center;gap:8px}
.count{min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:var(--brand);font-size:.8125rem;font-weight:800;display:inline-grid;place-items:center;padding:0 7px}

/* 하위 화면 헤더 */
.page-head{position:sticky;top:0;z-index:7;background:var(--surface);min-height:56px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line)}
.page-head h1{margin:0;font-size:1.0625rem;font-weight:700;flex:1}
.page-head .sub{display:block;font-size:.8125rem;font-weight:500;color:var(--ter)}

/* 챗봇 */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-log{flex:1;padding:20px 16px 12px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--ink);padding:10px 14px;border-radius:18px 18px 4px 18px}
.msg.bot{align-self:flex-start;width:88%}
.msg.bot .text{background:var(--bg);padding:12px 14px;border-radius:4px 18px 18px 18px;white-space:pre-line}
.cards{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.card-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.card-row:first-child{border-top:0}
.card-row .t{flex:1;min-width:0}
.card-row .num{width:26px;height:26px;border-radius:50%;background:var(--brand-weak);color:var(--brand-text);font-weight:800;font-size:.8125rem;display:grid;place-items:center;flex:none}
.card-row .t b{display:block;font-weight:600}
.card-row .t small{display:block;color:var(--sub);font-size:.875rem}
.add-btn{min-height:44px;padding:0 14px;border-radius:10px;background:var(--brand-weak);color:var(--brand-text);font-weight:700;font-size:.9375rem;flex:none}
.add-btn:disabled{background:var(--bg);color:var(--ter)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.replay{margin-top:2px;color:var(--ter);font-size:.8125rem;min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.replay .ic svg{width:18px;height:18px}
.typing{align-self:flex-start;background:var(--bg);border-radius:4px 18px 18px 18px;padding:12px 16px;color:var(--ter);font-size:.9375rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);font-size:.9375rem;color:var(--sub);background:#fff}
.chip:active{background:var(--bg)}
.composer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.cart-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 8px;font-size:.9375rem;color:var(--sub)}
.cart-strip b{color:var(--ink)}
.cart-strip button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--brand-weak);color:var(--brand-text);font-weight:700;font-size:.875rem}
.input-row{display:flex;gap:8px;align-items:center}
.input-row input{flex:1;min-width:0;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:1rem}
.input-row input:focus{background:#fff;border-color:var(--brand-text)}
.mic,.send{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.mic{background:var(--bg);color:var(--ink)}
.mic[aria-pressed="true"]{background:var(--danger);color:#fff}
.send{background:var(--brand);color:var(--ink)}

/* 장바구니·주문 상태 */
.pad{padding:20px}
.table-chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;background:var(--bg);color:var(--sub);font-size:.875rem;font-weight:600}
.cart-list{list-style:none;margin:16px 0 0;padding:0}
.cart-item{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-item .t{flex:1;min-width:0}
.cart-item .t b{display:block;font-weight:600}
.cart-item .t span{color:var(--sub);font-size:.9375rem}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;flex:none}
.stepper button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.stepper button .ic svg{width:20px;height:20px}
.stepper output{min-width:32px;text-align:center;font-weight:700}
.sum{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:1.125rem;font-weight:700}
.notice{background:var(--bg);border-radius:12px;padding:14px 16px;color:var(--sub);font-size:.9375rem;margin:0}
.empty{padding:64px 20px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:1.125rem;margin-bottom:4px}
.status-hero{text-align:center;padding:40px 20px 24px}
.status-hero .mark{width:64px;height:64px;border-radius:50%;background:var(--brand-weak);color:var(--brand-text);display:grid;place-items:center;margin:0 auto 16px}
.status-hero .mark .ic svg{width:32px;height:32px}
.status-hero h1{margin:0;font-size:1.375rem}
.status-hero p{margin:6px 0 0;color:var(--sub)}
.status-hero .order-no{font-size:2.5rem;font-weight:800;letter-spacing:-.02em;margin:16px 0 0;color:var(--ink)}
.steps{list-style:none;display:flex;margin:8px 20px 24px;padding:0}
.steps li{flex:1;text-align:center;font-size:.875rem;color:var(--ter);position:relative;padding-top:22px}
.steps li::before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line);z-index:1}
.steps li::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::after{display:none}
.steps li.on{color:var(--ink);font-weight:700}
.steps li.on::before,.steps li.on::after{background:var(--brand)}
.receipt{border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:0 20px}
.receipt .r{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.receipt .r:last-child{border-bottom:0;font-weight:700}
.stack{display:grid;gap:8px;padding:20px}

/* 시트 */
#sheetRoot{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheetRoot:empty{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:90dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;pointer-events:auto}
#sheetRoot.open .backdrop{opacity:1}
#sheetRoot.open .sheet{transform:none}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{margin:0;font-size:1.375rem;letter-spacing:-.01em}
.sheet .lead{margin:6px 0 0;color:var(--sub)}
.sheet .price-big{margin:12px 0 0;font-size:1.25rem;font-weight:700}
.meta{margin:20px 0 0;border-top:1px solid var(--line)}
.meta div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.meta dt{width:84px;flex:none;color:var(--ter)}
.meta dd{margin:0;flex:1}
.sheet-actions{display:flex;align-items:center;gap:12px;margin-top:20px}
.sheet-foot{display:grid;gap:8px;margin-top:16px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;text-align:left;margin-top:10px}
.choice:active{background:var(--bg)}
.choice .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-weak);color:var(--brand-text);display:grid;place-items:center;flex:none}
.choice b{display:block;font-size:1.0625rem}
.choice small{display:block;color:var(--sub);font-size:.875rem}
.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.setting b{display:block}
.setting small{display:block;color:var(--sub);font-size:.875rem}
.switch{width:52px;height:32px;border-radius:16px;background:#D6CCBA;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand-dark)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* 관리자 */
.admin-head{padding:16px 12px 12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:7}
.wordmark{font-weight:800;font-size:1.25rem;letter-spacing:-.03em;color:var(--ink)}
.admin-head small{display:block;color:var(--sub);font-size:.875rem}
.seg{display:flex;margin:16px 20px 0;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.admin-body{padding:16px 20px 40px}
.order-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.order-card.staff{border-color:#F5C2A8;background:var(--hot-weak)}
.order-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order-card .top b{font-size:1.0625rem}
.order-card .top time{color:var(--ter);font-size:.875rem}
.order-card ul{list-style:none;margin:10px 0;padding:0;color:var(--sub)}
.order-card .bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:.8125rem;font-weight:700;background:var(--bg);color:var(--sub)}
.pill.received{background:var(--hot-weak);color:var(--hot)}
.pill.preparing{background:var(--brand-weak);color:var(--brand-text)}
.pill.done{background:#E7F6EE;color:var(--ok)}
.sec-title{font-size:.9375rem;color:var(--ter);font-weight:600;margin:24px 0 8px}
.admin-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.admin-row .t{flex:1;min-width:0}
.admin-row .t b{display:block;font-weight:600}
.admin-row .t small{color:var(--sub);font-size:.875rem}
.link-btn{min-height:44px;padding:0 10px;color:var(--brand-text);font-weight:600}
.field{display:block;margin-top:16px}
.field>span{display:block;font-size:.9375rem;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:1rem}
.field textarea{padding:12px 14px;min-height:88px;resize:vertical}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:.9375rem}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.hint{font-size:.875rem;color:var(--sub);margin:6px 0 0}
.danger-link{color:var(--danger);font-weight:600;min-height:44px}


/* 챗봇 런처 (화면 오른쪽 아래) */
.bot-launcher{position:fixed;right:max(16px,calc((100vw - 480px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none;transition:bottom .2s}
.bot-launcher>*{pointer-events:auto}
.bot-launcher.lift{bottom:calc(92px + env(safe-area-inset-bottom))}
.bot-hint{position:relative;display:flex;align-items:center;gap:2px;background:#FFF8E6;border:2px solid var(--brand);border-radius:22px;box-shadow:0 10px 26px rgba(120,80,0,.16);padding:8px 6px 8px 10px;max-width:min(320px,calc(100vw - 32px));margin-bottom:6px;transform-origin:calc(100% - 46px) calc(100% + 12px);animation:hintIn .35s cubic-bezier(.2,.9,.3,1.3) both}
.bot-hint::after{content:"";position:absolute;right:36px;bottom:-9px;width:16px;height:16px;background:#FFF8E6;border-right:2px solid var(--brand);border-bottom:2px solid var(--brand);border-bottom-right-radius:4px;transform:rotate(45deg)}
.bot-hint .open{display:flex;align-items:center;gap:10px;min-height:52px;text-align:left;padding-right:4px}
.bot-hint .face{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--brand)}
.bot-hint .face img{width:100%;height:100%;display:block}
.bot-hint .tag{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.02em;background:var(--brand);color:var(--ink);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.bot-hint b{display:block;font-size:1rem;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.bot-hint small{display:block;font-size:.8125rem;color:var(--sub);line-height:1.35;margin-top:1px}
.bot-hint .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none;align-self:flex-start}
.bot-hint .x:active{background:#F5E7C4}
.bot-hint .x .ic svg{width:18px;height:18px}
@keyframes hintIn{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
.bot-fab{width:96px;height:96px;border-radius:50%;background:#FFF8E6;border:3px solid var(--brand);box-shadow:0 8px 22px rgba(80,55,10,.22);overflow:hidden;display:grid;place-items:center;padding:10px}
.bot-fab:active{transform:scale(.96)}
.bot-fab img{width:100%;height:auto;display:block}
.head-logo{height:30px;width:auto;display:block}
.foot-logo{height:22px;width:auto;display:block}
.admin-logo{height:32px;width:auto;display:block;margin-bottom:2px}
.av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--brand);background:#fff;flex:none}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.msg.bot .who{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink);font-weight:700;margin:0 0 6px}
.page-head .av{margin-right:8px}


/* 관리자 번호 입력 */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom));background:var(--surface)}
.lock-top{width:100%;display:flex;justify-content:flex-start}
.lock-logo{height:44px;width:auto;margin:28px 0 20px}
.lock h1{margin:0;font-size:1.375rem;letter-spacing:-.01em}
.lock .lead{margin:6px 0 0;color:var(--sub);text-align:center}
.dots{display:flex;gap:16px;margin:32px 0 12px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid #D6C9AE;background:transparent;transition:background .15s,border-color .15s}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock-msg{min-height:24px;color:var(--danger);font-size:.9375rem;font-weight:600;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px;margin-top:auto;padding-top:24px}
.keypad button{height:64px;border-radius:16px;text-align:center;background:#F7F0E1;font-size:1.5rem;font-weight:700;color:var(--ink)}
.keypad button:active{background:var(--brand)}
.keypad button.fn{background:transparent;font-size:1rem;font-weight:600;color:var(--sub)}
.keypad button:disabled{opacity:.4}
.lock-note{margin:16px 0 0;font-size:.8125rem;color:var(--ter);text-align:center}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:60;background:rgba(43,36,28,.94);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9375rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);width:max-content;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

      if (!r.pool.length) return { text:`${r.label} 메뉴는 지금 없어요. 다른 조건으로 물어봐 주세요.` };
      lastPool = r.pool; lastShown = Math.min(3, r.pool.length);
      return { text:`${r.label} 메뉴는 ${r.pool.length}가지예요.${r.pool.length > 3 ? ' 먼저 3개 알려 드릴게요.' : ''}`, items:r.pool.slice(0, 3) };
    }
  }
  const refs = ordinalRefs(s);
  // 두 메뉴 비교: "첫 번째랑 두 번째 차이 뭐야", "아메리카노랑 콜드브루 뭐가 달라"
  if (COMPARE_RE.test(s)) {
    const named = findAllMenus(s);
    const picked = [...refs, ...named.filter(m => !refs.includes(m))];
    let pair;
    if (picked.length >= 2) pair = picked;
    else if (picked.length === 1) pair = lastMenu && lastMenu !== picked[0] ? [lastMenu, picked[0]] : [];
    else pair = lastList.slice(0, 2);
    if (pair.length < 2) return { text: picked.length === 1 ? `${josa(picked[0].name, '을', '를')} 어떤 메뉴와 비교할까요? 예: "${picked[0].name}랑 아메리카노 차이"` : '비교할 메뉴 두 가지를 말씀해 주세요. 예: "아메리카노랑 콜드브루 차이 알려줘"' };
    return { text:compareText(pair[0], pair[1]), items:pair.slice(0, 2), quietItems:true };
  }
  const menu = findMenuByName(s) || refs[0] || pronounRef(s);
  // 3. 장바구니 확인 / 주문하기
  if (!menu && RE.cart.test(s)) {
    if (!cartCount()) return { text:'아직 담은 메뉴가 없어요. 드시고 싶은 메뉴를 말씀해 주세요.', chips:['많이 찾는 메뉴', '메뉴 종류 알려줘'] };
    pendingConfirm = true;
    return { text:`지금 담은 메뉴는 ${cartSummaryText()}이에요.\n이대로 주문하려면 "주문 확정"이라고 말하거나 아래 버튼을 눌러 주세요.`,
      actions:[{ label:`${won(cartTotal())} 주문하기`, primary:true, run:placeOrder }, { label:'장바구니 수정', run:() => go('#/cart') }] };
  }
  // 4. 특정 메뉴
  if (menu) {
    if (RE.remove.test(s)) {
      if (!cart.find(c => c.id === menu.id)) return { text:`${josa(menu.name, '은', '는')} 담겨 있지 않아요.` };
      setQty(menu.id, 0); lastMenu = menu;
      return { text:`${josa(menu.name, '을', '를')} 뺐어요.` + (cartCount() ? ` 지금 ${cartSummaryText()}이에요.` : ' 장바구니가 비었어요.') };
    }
    let rest = s.replace(/\s/g, '');
    [menu.name, ...(menu.aliases || [])].forEach(n => { rest = rest.split(n.replace(/\s/g, '')).join(' '); });
    if (RE.allergyWord.test(s) || (RE.negation.test(rest) && mentionedAllergens(rest).length)) {
      return { text:`${menu.name}의 알레르기 정보: ${allergenText(menu)}\n조리 과정에서 섞일 수 있는지는 등록되어 있지 않아요. 알레르기가 있다면 꼭 직원에게 확인해 주세요.`,
        actions:[{ label:'직원 호출하기', run:callStaff }] };
    }
    if (RE.add.test(s) && !/얼마|가격|설명|어때|뭐야|알려|무슨\s*맛/.test(s)) {
      if (menu.soldOut) return { text:`죄송해요. ${josa(menu.name, '은', '는')} 지금 품절이에요. 비슷한 메뉴를 추천해 드릴까요?`, chips:[`${menu.category} 추천해줘`] };
      const q = parseQty(s); addToCart(menu.id, q); lastMenu = menu;
      return { text:`${menu.name} ${q}개를 담았어요. 지금 ${cartSummaryText()}이에요.\n더 고르시거나 "주문할게"라고 말씀해 주세요.` };
    }
    return { text:`${menu.name}, ${menu.soldOut ? '지금은 품절이에요.' : won(menu.price) + '이에요.'}\n${menu.desc}\n${menu.caffeine ? '카페인이 들어 있어요.' : '카페인이 없어요.'}\n알레르기 정보: ${allergenText(menu)}`,
      items:[menu] };
  }
  // 5. 알레르기 성분으로 찾기
  const alg = mentionedAllergens(s);
  const cat = detectCategory(s);
  if (alg.length && RE.negation.test(s)) {
    const safe = available().filter(m => Array.isArray(m.allergens) && !m.allergens.some(a => alg.includes(a))
      && (!cat || m.category === cat) && (!NO_CAFFEINE.test(s) || !m.caffeine));
    const unknown = available().filter(m => m.allergens === null && (!cat || m.category === cat));
    if (!safe.length) return { text:`등록된 정보로는 ${alg.join(', ')} 성분이 빠진 메뉴를 찾지 못했어요. 직원에게 확인해 주세요.`, actions:[{ label:'직원 호출하기', run:callStaff }] };
    lastPool = safe; lastShown = Math.min(4, safe.length);
    return { text:`등록된 정보 기준으로 ${alg.join(', ')} 성분이 표시되지 않은 메뉴예요.${unknown.length ? `\n${unknown.map(m => m.name).join(', ')}${josa(unknown[unknown.length-1].name,'은','는').slice(-1)} 알레르기 정보가 아직 등록되지 않아 뺐어요.` : ''}\n조리 과정에서 섞일 수 있는지는 확인되지 않았으니, 드시기 전에 꼭 직원에게 확인해 주세요.`,
      items:safe.slice(0, 4), actions:[{ label:'직원 호출하기', run:callStaff }] };
  }
  if (RE.allergyWord.test(s) && /알레르기|알러지/.test(s) && !alg.length) {
    return { text:'말씀하신 성분은 메뉴 정보에 따로 등록되어 있지 않아 확인해 드릴 수 없어요. 직원에게 꼭 확인해 주세요.', actions:[{ label:'직원 호출하기', primary:true, run:callStaff }] };
  }
  if (alg.length && RE.containsWord.test(s)) {
    const withIt = available().filter(m => Array.isArray(m.allergens) && m.allergens.some(a => alg.includes(a)));
    if (withIt.length) { lastPool = withIt; lastShown = Math.min(3, withIt.length); return { text:`등록된 정보 기준으로 ${alg.join(', ')}${josa(alg[alg.length-1],'이','가').slice(-1)} 들어간 메뉴예요.\n등록되지 않은 메뉴도 있을 수 있으니 꼭 직원에게 확인해 주세요.`, items:withIt.slice(0, 3), actions:[{ label:'직원 호출하기', run:callStaff }] }; }
  }
  // 성분을 묻는 질문은 위에서 답하지 못했더라도 AI에게 넘기지 않는다 (추측 답변 방지)
  if ((alg.length && (RE.allergyWord.test(s) || RE.containsWord.test(s))) || /알레르기|알러지|알르레기/.test(s)) {
    return { text:`${alg.length ? `등록된 정보로는 ${alg.join(', ')} 성분을 확인할 수 있는 메뉴가 없어요.` : '성분은 메뉴별로 등록된 정보만 안내할 수 있어요.'}\n메뉴 이름과 함께 물어보시거나, 직원에게 꼭 확인해 주세요. 예: "카페라떼 알레르기 알려줘"`,
      actions:[{ label:'직원 호출하기', primary:true, run:callStaff }] };
  }
  // 6. 더 보기
  if (RE.more.test(s) && lastPool.length && !cat) {
    const next = lastPool.slice(lastShown, lastShown + 3);
    if (!next.length) return { text:'조건에 맞는 메뉴는 여기까지예요.' };
    lastShown += next.length;
    return { text:`이어서 ${next.length}개 더 알려 드릴게요.`, items:next };
  }
  // 7. 메뉴 종류 안내 (전체를 다 읽지 않고 먼저 좁힌다)
  if (RE.listAll.test(s) && !cat && !RE.latte.test(s)) {
    const counts = CATEGORIES.map(c => [c, available().filter(m => m.category === c).length]).filter(x => x[1]);
    return { text:`지금 주문할 수 있는 메뉴는 ${counts.map(([c, n]) => `${c} ${n}개`).join(', ')}예요.\n어떤 종류를 알려 드릴까요?`,
      chips: counts.map(([c]) => `${c} 메뉴 알려줘`) };
  }
  // 8. 조건 추천
  let pool = available(); const conds = [];
  if (NO_CAFFEINE.test(s)) { pool = pool.filter(m => !m.caffeine); conds.push('카페인 없는'); }
  const b = parseBudget(s);
  if (b) { pool = pool.filter(m => b.min ? m.price >= b.value : m.price <= b.value); conds.push(`${won(b.value)} ${b.min ? '이상' : '이하'}`); }
  if (RE.latte.test(s)) { pool = pool.filter(m => m.name.includes('라떼')); conds.push('라떼'); }
  else if (cat) { pool = pool.filter(m => m.category === cat); conds.push(cat); }
  if (RE.cheap.test(s)) { pool.sort((x, y) => x.price - y.price); conds.push('저렴한 순'); }
  else pool.sort((x, y) => (y.popular ? 1 : 0) - (x.popular ? 1 : 0));

  if (conds.length) {
    // "커피 추천해줘"처럼 분류만 말하고 후보가 많으면, 목록을 읽기 전에 한 번만 되묻는다
    const onlyCategory = conds.length === 1 && (cat || RE.latte.test(s));
    if (onlyCategory && RE.recommend.test(s) && pool.length > 3) {
      const c = clarifyFor(pool);
      if (c) { pendingClarify = Object.assign(c, { pool, label:conds[0] }); return { text:c.q, chips:c.chips }; }
    }
    if (!pool.length) return { text:`${conds.join(', ')} 조건에 맞는 메뉴가 지금은 없어요. 조건을 바꿔서 물어봐 주세요.`, chips:['많이 찾는 메뉴', '메뉴 종류 알려줘'] };
    lastPool = pool; lastShown = Math.min(3, pool.length);
    const more = pool.length > 3 ? `\n모두 ${pool.length}개예요. 더 들으려면 "더 보여줘"라고 말씀해 주세요.` : '';
    return { text:`${conds.join(', ')} 메뉴 중에서 골랐어요.${more}`, items:pool.slice(0, 3) };
  }
  if (RE.recommend.test(s)) {
    const pop = available().filter(m => m.popular);
    lastPool = pop; lastShown = Math.min(3, pop.length);
    return { text:'이 매장에서 많이 찾는 메뉴예요.', items:pop.slice(0, 3), askAI:true };
  }
  return { text:'잘 이해하지 못했어요. 이렇게 물어봐 주세요.\n예: "카페인 없는 메뉴", "5천 원 이하 논커피", "아메리카노 두 잔 담아줘"',
    chips:['많이 찾는 메뉴', '카페인 없는 메뉴', '우유 없는 메뉴'], askAI:true };
}

// AI 서버에 묻기. 실패하면 규칙 엔진 답을 그대로 쓴다.
const AI_TIMEOUT_MS = 12000; // 서버의 OpenAI 타임아웃(10초)보다 조금 길게
async function askAI(question) {
  // 방금 addMessage 로 넣은 이번 질문은 question 으로 따로 보내므로 history 에서 뺀다
  const history = chat.slice(0, -1).slice(-6)
    .filter(m => m && typeof m.text === 'string' && m.text.trim())
    .map(m => ({ role:m.from === 'user' ? 'user' : 'assistant', text:m.text }));
  const res = await fetch(CHAT_ENDPOINT, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    signal: AbortSignal.timeout ? AbortSignal.timeout(AI_TIMEOUT_MS) : undefined,
    body: JSON.stringify({ storeId:STORE.id, table:TABLE, question, history,
      menus }) // 실서비스에서는 서버가 DB에서 직접 메뉴를 읽으므로 보내지 않는다
  });
  if (!res.ok) throw new Error('chat ' + res.status); // 429·504 등은 규칙 엔진 답으로 대신한다
  const d = await res.json();
  const items = (Array.isArray(d.menuIds) ? d.menuIds : [])
    .map(id => menus.find(m => String(m.id) === String(id)))
    .filter((m, i, arr) => m && !m.soldOut && arr.indexOf(m) === i).slice(0, 3);
  const text = String(d.text || '').trim().slice(0, 400);
  if (!text) throw new Error('empty reply');
  return { text, items };
}

async function send(raw, byVoice) {
  const q = String(raw || '').trim(); if (!q) return;
  const input = $('#q'); if (input) input.value = '';
  addMessage({ from:'user', text:q });
  let r = ruleEngine(q);
  if (r.askAI && CHAT_ENDPOINT) {
    const typing = h('div', { class:'typing', 'aria-hidden':'true', text:'답을 찾고 있어요…' });
    $('#log')?.append(typing); scrollChat();
    try { r = await askAI(q); } catch (e) { console.warn('AI 응답 실패, 규칙 엔진 답 사용:', e); }
    typing.remove();
  }
  if (r.items?.length) {
    lastList = r.items; if (r.items.length === 1) lastMenu = r.items[0];
    if (r.items.length > 1 && !refHintShown && !r.quietItems) { r.text += '\n번호로 고를 수 있어요. 예: "두 번째 거 담아줘", "첫 번째랑 두 번째 차이 알려줘"'; refHintShown = true; }
  }
  addMessage(Object.assign({ from:'bot' }, r), byVoice);
}
function addMessage(msg, forceSpeak) {
  chat.push(msg);
  const log = $('#log');
  if (log) { log.append(renderMsg(msg)); scrollChat(); }
  // 말로 물어본 질문은 설정과 상관없이 답도 소리로 읽어 준다
  if (msg.from === 'bot') speak(msg.text.replace(/\n/g, ' ') + (msg.items?.length && !msg.quietItems ? ' ' + itemsSpeech(msg.items) : ''), forceSpeak && prefs.voiceReply);
}
function scrollChat() { requestAnimationFrame(() => window.scrollTo({ top:document.body.scrollHeight })); }

let tabObserver = null;
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function currentRoute() { return location.hash.replace(/^#\/?/, '').split('/')[0] || 'menu'; }
let firstRender = true;
function route(keepScroll) {
  closeSheet(true); stopListening();
  if (tabObserver) { tabObserver.disconnect(); tabObserver = null; }
  const r = currentRoute();
  const view = $('#view');
  const y = window.scrollY;
  route.keep = !!keepScroll;
  if (r === 'chat') view.replaceChildren(...renderChat());
  else if (r === 'cart') view.replaceChildren(...renderCart());
  else if (r === 'order') view.replaceChildren(...renderOrder());
  else if (r === 'admin') view.replaceChildren(...(session.get(KEY.adminOk, false) ? renderAdmin() : renderAdminLock()));
  else view.replaceChildren(...renderMenu());
  document.title = r === 'admin' ? 'Orderly 매장 관리' : STORE.name;
  if (keepScroll) window.scrollTo(0, y);
  else if (r === 'chat') scrollChat();
  else window.scrollTo(0, 0);
  if (!keepScroll && !firstRender) $('#view h1')?.focus();
  firstRender = false;
}
window.addEventListener('hashchange', () => route());

function renderAdminLock() {
  let pin = '';
  let fails = session.get('orderly.pinFails', 0);
  const dots = h('div', { class:'dots', 'aria-hidden':'true' }, [0, 1, 2, 3].map(() => h('span')));
  const status = h('p', { class:'sr-only', 'aria-live':'polite' });
  const msg = h('p', { class:'lock-msg', role:'alert' });
  const lockedLeft = () => Math.max(0, Math.ceil(((local.get(KEY.lockUntil, 0) || 0) - Date.now()) / 1000));
  const paint = () => {
    dots.querySelectorAll('span').forEach((d, i) => d.classList.toggle('on', i < pin.length));
    status.textContent = `${pin.length}자리 입력됨`;
  };
  const setLocked = () => {
    const left = lockedLeft();
    keypad.querySelectorAll('button').forEach(b => { b.disabled = left > 0; });
    if (left > 0) { msg.textContent = `번호를 여러 번 틀렸어요. ${left}초 후에 다시 입력해 주세요.`; setTimeout(setLocked, 1000); }
    else if (msg.textContent.includes('초 후')) msg.textContent = '';
  };
  const check = () => {
    if (pin === ADMIN_PIN) {
      session.set(KEY.adminOk, true); session.set('orderly.pinFails', 0);
      document.removeEventListener('keydown', onKey); route(); return;
    }
    fails++; session.set('orderly.pinFails', fails);
    pin = ''; paint();
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    if (fails >= 5) { local.set(KEY.lockUntil, Date.now() + 30000); session.set('orderly.pinFails', 0); fails = 0; setLocked(); }
    else msg.textContent = `번호가 맞지 않아요. 다시 입력해 주세요. (${fails}/5)`;
  };
  const press = d => {
    if (lockedLeft() > 0 || pin.length >= 4) return;
    pin += d; paint();
    if (pin.length === 4) setTimeout(check, 120);
  };
  const back = () => { pin = pin.slice(0, -1); paint(); };
  const keypad = h('div', { class:'keypad', role:'group', 'aria-label':'번호 입력' },
    ['1','2','3','4','5','6','7','8','9'].map(d => h('button', { onclick:() => press(d) }, d)),
    h('button', { class:'fn', onclick:() => { pin = ''; paint(); }, 'aria-label':'모두 지우기' }, '전체 삭제'),
    h('button', { onclick:() => press('0') }, '0'),
    h('button', { class:'fn', onclick:back, 'aria-label':'한 자리 지우기' }, '지우기'));
  // PC에서는 키보드 숫자로도 입력할 수 있다
  function onKey(e) {
    if (currentRoute() !== 'admin') { document.removeEventListener('keydown', onKey); return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') back();
  }
  if (renderAdminLock.key) document.removeEventListener('keydown', renderAdminLock.key);
  renderAdminLock.key = onKey;
  document.addEventListener('keydown', onKey);
  setTimeout(setLocked);
  return [h('main', { class:'lock' },
    h('div', { class:'lock-top' }, h('button', { class:'icon-btn', 'aria-label':'손님 화면으로 돌아가기', onclick:() => { document.removeEventListener('keydown', onKey); go('#/'); } }, icon('back'))),

    h('h1', { tabindex:'-1', text:'매장 관리자' }),
    h('p', { class:'lead', text:`${STORE.name} 관리자 번호 4자리를 입력해 주세요.` }),
    dots, status, msg, keypad,
    h('p', { class:'lock-note', text:'시연용 관리자 번호는 1234예요.' }))];
}

  return h('main', { class:'admin-body' },
    h('button', { class:'btn btn-secondary', onclick:() => editMenu(null) }, icon('plus'), '메뉴 추가'),
    h('p', { class:'hint', text:'저장하면 손님 메뉴판과 챗봇 답변에 바로 반영돼요. NFC 태그는 다시 만들 필요가 없어요.' }),
    rows,
    h('div', { style:'margin-top:32px' }, h('button', { class:'danger-link', onclick:() => {
      if (!confirm('메뉴와 주문 내역을 처음 상태로 되돌릴까요?')) return;
      local.del(KEY.menu); local.del(KEY.orders); local.del(KEY.seq); menus = loadMenus(); route(true); toast('시연 데이터를 초기화했어요.');
    } }, '시연 데이터 초기화')));
}
function editMenu(id) {
  const m = id ? getMenu(id) : { id:'m' + Date.now(), name:'', category:CATEGORIES[0], price:0, desc:'', caffeine:false, popular:false, soldOut:false, allergens:null, aliases:[] };
  const picked = new Set(m.allergens || []);
  const f = {
    name: h('input', { value:m.name, required:true, maxlength:'30' }),
    category: h('select', null, CATEGORIES.map(c => h('option', { value:c, selected:c === m.category }, c))),
    price: h('input', { type:'number', inputmode:'numeric', min:'0', step:'100', value:m.price }),
    desc: h('textarea', { maxlength:'120' }, m.desc),
    caffeine: h('input', { type:'checkbox', checked:!!m.caffeine }),
    popular: h('input', { type:'checkbox', checked:!!m.popular }),
    none: h('input', { type:'checkbox', checked:Array.isArray(m.allergens) && !m.allergens.length })
  };
  const picks = h('div', { class:'picks', role:'group', 'aria-label':'알레르기 유발 성분' }, ALLERGENS.map(a => {
    const b = h('button', { type:'button', class:'pick', 'aria-pressed':String(picked.has(a)) }, a);
    b.addEventListener('click', () => { picked.has(a) ? picked.delete(a) : picked.add(a); b.setAttribute('aria-pressed', String(picked.has(a))); if (picked.size) f.none.checked = false; });
    return b;
  }));
  f.none.addEventListener('change', () => { if (f.none.checked) { picked.clear(); picks.querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', 'false')); } });
  const save = () => {
    const name = f.name.value.trim(); const price = Math.round(Number(f.price.value));
    if (!name) { toast('메뉴 이름을 입력해 주세요.'); f.name.focus(); return; }
    if (!Number.isFinite(price) || price < 0) { toast('가격을 확인해 주세요.'); f.price.focus(); return; }
    Object.assign(m, { name, category:f.category.value, price, desc:f.desc.value.trim(), caffeine:f.caffeine.checked, popular:f.popular.checked,
      allergens: picked.size ? ALLERGENS.filter(a => picked.has(a)) : (f.none.checked ? [] : null) });
    if (!id) menus.push(m);
    saveMenus(); closeSheet(); route(true); toast('저장했어요. 손님 화면에 바로 반영돼요.');
  };
  openSheet(id ? '메뉴 수정' : '메뉴 추가',
    h('h2', { text: id ? '메뉴 수정' : '메뉴 추가' }),
    h('label', { class:'field' }, h('span', { text:'메뉴 이름' }), f.name),
    h('label', { class:'field' }, h('span', { text:'분류' }), f.category),
    h('label', { class:'field' }, h('span', { text:'가격(원)' }), f.price),
    h('label', { class:'field' }, h('span', { text:'설명' }), f.desc),
    h('label', { class:'check' }, f.caffeine, '카페인이 들어 있어요'),
    h('label', { class:'check' }, f.popular, '인기 메뉴로 표시'),
    h('div', { class:'field' }, h('span', { text:'알레르기 유발 성분' }), picks,
      h('label', { class:'check' }, f.none, '확인 결과 알레르기 유발 성분 없음'),
      h('p', { class:'hint', text:'아무것도 고르지 않으면 "미등록"으로 저장되고, 챗봇은 직원 확인을 안내해요.' })),
    h('div', { class:'sheet-foot' },
      h('button', { class:'btn btn-primary', onclick:save }, '저장'),
      id ? h('button', { class:'danger-link', onclick:() => { if (!confirm(`${josa(m.name, '을', '를')} 삭제할까요?`)) return;
        menus = menus.filter(x => x.id !== id); saveMenus(); closeSheet(); route(true); toast('삭제했어요.'); } }, '메뉴 삭제') : null));
}

/* ---------- 다른 탭의 변경 반영 (손님 ↔ 관리자 실시간 시연) ---------- */
window.addEventListener('storage', e => {
  if (e.key === KEY.menu) { menus = loadMenus(); if (!$('#sheetRoot').children.length) route(true); }
  if (e.key === KEY.orders) {
    const r = currentRoute();
    if (r === 'order') {
      const before = route.lastStatus; route(true);
      const o = myLatestOrder();
      if (o && before && before !== o.status) speak(o.status === 'preparing' ? '메뉴를 준비하고 있어요.' : o.status === 'done' ? '준비가 끝났어요. 곧 자리로 가져다 드릴게요.' : '');
    } else if (r === 'admin' || r === 'menu') { if (!$('#sheetRoot').children.length) route(true); }
  }
  route.lastStatus = myLatestOrder()?.status;
});

/* ---------- 시작 ---------- */
document.documentElement.classList.toggle('large', !!prefs.large);
route.lastStatus = myLatestOrder()?.status;
route();
</script>
</body>
</html>
